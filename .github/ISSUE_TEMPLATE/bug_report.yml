name: Bug report
description: Something in the editor or the PDF export does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140 on Windows 11
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Deployed site
        - Local dev server
        - Docker image
  - type: markdown
    attributes:
      value: 'Security problems: do not file them here, see SECURITY.md.'
