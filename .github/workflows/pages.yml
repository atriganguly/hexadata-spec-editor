name: Deploy web app (GitHub Pages)

# Publishes the editor after CI is green on main. The PDF engine is deployed separately (Render, see render.yaml).
# One-time setup: Settings > Pages > Source = "GitHub Actions". The engine URL comes from the repository variable
# PDF_API_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://hexadata-spec-editor.onrender.com
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # The renderer's Chrome is not needed to build the static web app.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Build the web app
        run: npm run build -w @hexadata/spec-web
        env:
          VITE_API_BASE_URL: ${{ vars.PDF_API_URL || 'https://hexadata-spec-editor.onrender.com' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
